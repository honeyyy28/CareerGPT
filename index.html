<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CareerGPS</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6f7fb;--c:#fff;--t:#1b1f3b;--m:#6b7089;--b:#e4e6f0;--p:#5b4bdb;--p2:#eeebff;--g:#16a34a;--o:#f59e0b;--r:#ef4444}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1120;--c:#181b30;--t:#eef0ff;--m:#9aa0c0;--b:#2a2e4a;--p:#8b7dff;--p2:#252350}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{margin:0 0 8px;line-height:1.2}p{margin:0 0 10px;color:var(--m)}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:19px;display:flex;gap:8px;align-items:center;cursor:pointer}.logo svg{width:28px;height:28px}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}nav a{padding:7px 11px;border-radius:9px;cursor:pointer;color:var(--m);font-weight:500;font-size:14px}nav a.on,nav a:hover{background:var(--p2);color:var(--p)}
main{max-width:1050px;margin:0 auto;padding:22px 18px 110px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(20,20,60,.05)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 14px inherit;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px);opacity:.92}.btn.s{background:var(--p2);color:var(--p)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:9px;background:var(--bg);color:var(--t);font:inherit}label{font-size:12px;color:var(--m);font-weight:600}
.hero{text-align:center;padding:40px 0 20px}.hero h1{font-size:clamp(28px,5vw,46px);max-width:760px;margin:0 auto 12px}.hero p{max-width:620px;margin:0 auto 20px;font-size:16px}
.flow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:26px 0}.flow span{background:var(--c);border:1px solid var(--b);padding:8px 14px;border-radius:99px;font-weight:600;font-size:13px}.flow i{color:var(--p);font-style:normal;align-self:center}
.bar{height:9px;background:var(--b);border-radius:9px;overflow:hidden}.bar div{height:100%;background:var(--p);border-radius:9px;transition:width .8s}
.chip{display:inline-block;padding:6px 12px;margin:3px;border-radius:99px;border:1px solid var(--b);cursor:pointer;font-size:13px;user-select:none}.chip.l1{background:#e0f2fe;color:#075985}.chip.l2{background:var(--p2);color:var(--p);border-color:var(--p)}.chip.l3{background:var(--p);color:#fff}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}.H{background:#fee2e2;color:#b91c1c}.M{background:#fef3c7;color:#b45309}.L{background:#dcfce7;color:#15803d}
.tl{border-left:3px solid var(--p2);margin-left:10px;padding-left:20px}.tl .card{margin-bottom:14px;position:relative}.tl .card:before{content:"";position:absolute;left:-30px;top:20px;width:15px;height:15px;border-radius:50%;background:var(--p);border:3px solid var(--bg)}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--b)}.task:last-child{border:0}.task input{width:20px;height:20px}.done{opacity:.5;text-decoration:line-through}
.big{font-size:30px;font-weight:800}.mut{color:var(--m);font-size:13px}.empty{padding:16px;background:var(--p2);border-radius:12px;color:var(--p)}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 6px 20px rgba(91,75,219,.4);border-radius:99px;padding:13px 20px}
#chat{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:360px;max-width:calc(100vw - 36px);height:480px;max-height:70vh;display:none;flex-direction:column;z-index:10;padding:0;overflow:hidden}
#chat.open{display:flex}#msgs{flex:1;overflow:auto;padding:12px}.m{padding:9px 12px;border-radius:12px;margin:6px 0;max-width:88%;white-space:pre-line;font-size:14px}.m.b{background:var(--p2)}.m.u{background:var(--p);color:#fff;margin-left:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--t);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:20;pointer-events:none}#toast.on{opacity:1}
@media(max-width:700px){nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);justify-content:space-around;margin:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;flex-wrap:nowrap;overflow-x:auto}nav a{font-size:11px;padding:6px 8px;white-space:nowrap}#fab{bottom:calc(70px + env(safe-area-inset-bottom,0px))}#chat{bottom:calc(128px + env(safe-area-inset-bottom,0px))}}
</style></head><body>
<div class="top"><div class="logo" onclick="go('home')"><svg viewBox="0 0 32 32"><path d="M16 2a9 9 0 0 0-9 9c0 7 9 17 9 17s9-10 9-17a9 9 0 0 0-9-9z" fill="#5b4bdb"/><path d="M9 11l7-3 7 3-7 3z M12 13v3c2 2 6 2 8 0v-3" fill="#fff" stroke="#fff" stroke-width=".6"/></svg>CareerGPS</div><nav id="nav"></nav></div>
<main id="v"></main>
<button class="btn" id="fab" onclick="tw()">💬 Ask CareerTwin</button>
<div class="card" id="chat"><div style="padding:12px 14px;border-bottom:1px solid var(--b)"><b>CareerTwin 👋</b> <span class="mut">Your AI Career Companion</span></div><div id="msgs"></div><div style="padding:6px 10px" class="row" id="qa"></div><div class="row" style="padding:10px;flex-wrap:nowrap"><input id="ci" placeholder="Ask about your career…" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Send</button></div></div>
<div id="toast"></div>
<script>
const SK=["Python","C","Java","HTML","CSS","JavaScript","React","SQL","Git","DSA","Machine Learning","Statistics","Networking","Security","Cloud","Figma"],SOFT=["Communication","Leadership","Teamwork","Problem Solving","Time Management","Presentation"],LV=["","Beginner","Intermediate","Advanced"],
// weights: edu,tech,proj,cert,exp,soft,portfolio (configurable per career)
CAR={"Software Engineer":{w:[15,30,20,10,15,5,5],s:{DSA:3,Python:2,Java:2,SQL:2,Git:2,JavaScript:2,Cloud:1},p:3,c:2,e:1,soft:["Problem Solving","Teamwork","Communication"],d:"Medium",wk:26},
"Data Scientist":{w:[20,35,15,10,10,5,5],s:{Python:3,SQL:3,Statistics:2,"Machine Learning":3,DSA:2,Git:1},p:3,c:3,e:1,soft:["Problem Solving","Communication","Presentation"],d:"Hard",wk:32},
"Web Developer":{w:[10,35,25,10,10,5,5],s:{HTML:3,CSS:3,JavaScript:3,React:2,Git:2,SQL:1},p:4,c:1,e:1,soft:["Communication","Time Management","Teamwork"],d:"Easy",wk:20},
"Cybersecurity Analyst":{w:[15,35,15,15,10,5,5],s:{Networking:3,Security:3,Python:2,Cloud:1,C:1},p:2,c:3,e:1,soft:["Problem Solving","Communication","Time Management"],d:"Hard",wk:30}},
WHY={DSA:"DSA is the core of technical interviews and efficient problem solving.",SQL:"SQL is used everywhere to query and analyze structured data.","Machine Learning":"ML powers prediction and AI-driven products.",Git:"Git is essential for collaboration in every engineering team.",Statistics:"Statistics underpins every data decision.",Cloud:"Most products are deployed on cloud platforms.",Java:"Java is widely used in enterprise backends.",Python:"Python is the go-to language for scripting and data work.",JavaScript:"JavaScript runs the modern web.",React:"React is the most requested front-end library.",Networking:"Networking knowledge is the base of security work.",Security:"Security skills are the heart of the role.",HTML:"HTML structures every web page.",CSS:"CSS makes interfaces usable and beautiful.",C:"C builds low-level system understanding."},
RES={DSA:"NeetCode / LeetCode Easy→Medium",SQL:"Mode SQL Tutorial + SQLBolt","Machine Learning":"Andrew Ng ML Specialization",Git:"Pro Git book (free)",Statistics:"Khan Academy Statistics",Cloud:"AWS Cloud Practitioner Essentials"},
LEVELS=[[0,"Career Explorer"],[300,"Skill Builder"],[800,"Job Ready"],[1500,"Career Pro"],[2500,"Industry Ready"]];
let S=load()||{auth:false,name:"",email:"",degree:"",college:"",cgpa:0,skills:{},soft:{},projects:[],certs:[],interns:[],noIntern:false,resume:false,github:false,linkedin:false,career:"",xp:0,tasks:[],hist:[],view:"home"},chat=[];
function load(){try{return JSON.parse(localStorage.getItem("cg"))}catch(e){return null}}
function save(){try{localStorage.setItem("cg",JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),pct=n=>Math.round(n*100);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
function calc(career=S.career){const C=CAR[career];if(!C)return null;const w=C.w,ks=Object.keys(C.s);
const cat={Education:Math.min(1,(S.cgpa||0)/8)*(S.degree?1:.6),"Technical Skills":ks.reduce((a,k)=>a+Math.min(1,(S.skills[k]||0)/C.s[k]),0)/ks.length,Projects:Math.min(1,S.projects.length/C.p),Certifications:Math.min(1,S.certs.length/C.c),Internship:Math.min(1,S.interns.length/C.e),"Soft Skills":C.soft.reduce((a,k)=>a+((S.soft[k]||0)/2>1?1:(S.soft[k]||0)/2),0)/C.soft.length,"Resume & Portfolio":((S.resume?1:0)+(S.github?1:0)+(S.linkedin?1:0))/3};
const total=Object.values(cat).reduce((a,v,i)=>a+v*w[i],0);
const gaps=ks.map(k=>({k,cur:S.skills[k]||0,req:C.s[k],gap:C.s[k]-(S.skills[k]||0)})).filter(g=>g.gap>0).sort((a,b)=>b.gap-a.gap||b.req-a.req);
gaps.forEach((g,i)=>g.pri=g.gap>=2||(g.req===3&&g.gap>0)?"H":g.gap===1&&i<4?"M":"L");
return{cat,total:Math.round(total),gaps,w,strong:ks.filter(k=>(S.skills[k]||0)>=C.s[k])}}
function ring(v,sz=170){const r=sz/2-12,c=2*Math.PI*r;return`<svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--b)" stroke-width="12"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--p)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" transform="rotate(-90 ${sz/2} ${sz/2})" style="transition:1s"/><text x="50%" y="52%" text-anchor="middle" font-size="${sz/4.2}" font-weight="800" fill="var(--t)">${v}</text><text x="50%" y="${sz/2+24}" text-anchor="middle" font-size="12" fill="var(--m)">/ 100</text></svg>`}
const pb=(v,l)=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><b>${l}</b><span class="mut">${v}%</span></div><div class="bar"><div style="width:${v}%"></div></div></div>`;
function genTasks(){const a=calc();if(!a)return;const t=[];a.gaps.slice(0,4).forEach(g=>{t.push({id:"s"+g.k,t:g.k==="DSA"?"Solve 3 DSA problems":`Complete a ${g.k} lesson`,sk:g.k,df:g.gap>1?"Medium":"Easy",min:g.k==="DSA"?60:40,due:"Today",done:false});t.push({id:"w"+g.k,t:`Build a mini exercise in ${g.k}`,sk:g.k,df:"Medium",min:45,due:"This week",done:false})});
t.push({id:"p",t:"Work 30 minutes on your project",sk:"Projects",df:"Easy",min:30,due:"Today",done:false},{id:"i",t:"Practice one interview question",sk:"Interview",df:"Easy",min:15,due:"This week",done:false});
const old=Object.fromEntries(S.tasks.map(x=>[x.id,x.done]));S.tasks=t.map(x=>({...x,done:!!old[x.id]}))}
function roadmap(){const a=calc();if(!a)return[];const m=[],g=a.gaps,C=CAR[S.career];for(let i=0;i<g.length;i+=2){const p=g.slice(i,i+2).map(x=>x.k);m.push([p.join(" + "),`Reach ${p.map(k=>LV[C.s[k]]).join(" / ")} level. ~${p.reduce((s,k)=>s+(C.s[k]-(S.skills[k]||0))*3,0)} weeks of focused practice.`])}
if(S.projects.length<C.p)m.push(["Portfolio Project","Build "+(C.p-S.projects.length)+" more project(s) using your new skills and publish on GitHub."]);
if(!S.interns.length)m.push(["Internship Preparation","No internship yet? That's okay. Apply to 10 internships and practice case-style interviews."]);
if(S.certs.length<C.c)m.push(["Certification","Earn "+(C.c-S.certs.length)+" role-relevant certificate(s)."]);
m.push(["Resume + Mock Interviews + Applications","Polish resume, run 3 mock interviews, start job applications."]);return m}
const level=()=>[...LEVELS].reverse().find(l=>S.xp>=l[0]),done=()=>S.tasks.filter(t=>t.done).length;
function go(v){S.view=v;save();render();scrollTo(0,0)}
const NAV=[["dash","Dashboard"],["profile","Profile"],["career","Dream Career"],["gap","Career Gap"],["roadmap","Roadmap"],["tasks","Tasks"],["compare","Compare"]];
function render(){const n=$("#nav");n.innerHTML=S.auth?NAV.map(([k,l])=>`<a class="${S.view===k?"on":""}" onclick="go('${k}')">${l}</a>`).join("")+`<a onclick="logout()">Logout</a>`:`<a onclick="go('signup')">Create Account</a><a onclick="demo()">Demo Student</a>`;
const V={home,signup,dash,profile,career,gap,roadmap:rm,tasks,compare};if(!S.auth&&!["home","signup"].includes(S.view))S.view="home";$("#v").innerHTML=V[S.view]();}
function home(){return`<div class="hero"><h1>Your Career Has a Destination. CareerGPS Shows You the Route.</h1><p>Build your student profile, choose your dream career, discover your skill gaps and follow a personalized roadmap to become career-ready.</p><div class="row" style="justify-content:center"><button class="btn" onclick="S.auth?go('profile'):go('signup')">Build My Profile</button><button class="btn s" onclick="S.auth?go('career'):demo('career')">Explore Careers</button><button class="btn s" onclick="demo()">▶ Try Demo Student</button></div><div class="flow"><span>🎓 Student Profile</span><i>→</i><span>🤖 AI Analysis</span><i>→</i><span>⚠ Skill Gap</span><i>→</i><span>🗺 Roadmap</span><i>→</i><span>🏁 Dream Job</span></div><p><i>Know where you are. Discover what you’re missing. Reach where you want to be.</i></p></div>
<h2>Why CareerGPS?</h2><div class="grid">${[["🎓","Student Profile","One place for skills, projects and experience."],["🎯","Dream Career","Search or let us recommend a destination."],["🤖","Career Gap Analysis","A transparent, weighted readiness score."],["📚","Personalized Learning","Resources and time estimates per skill."],["✅","Daily Career Tasks","Small tasks that earn CareerXP."],["📈","Progress Tracking","Watch readiness grow over time."]].map(c=>`<div class="card"><div class="big">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join("")}</div>
<h2 style="margin-top:28px">How it works</h2><div class="grid">${["Build your profile","Select your dream career","Get your Career Gap Score","Discover missing skills","Follow your roadmap","Track your progress","Reach your dream career"].map((s,i)=>`<div class="card row"><b class="big" style="color:var(--p)">${i+1}</b><span>${s}</span></div>`).join("")}</div>`}
function signup(){return`<div class="card" style="max-width:420px;margin:30px auto"><h2>Create your account</h2><p>Prototype auth: data is stored locally in your browser only.</p><label>Full name</label><input id="n"><br><br><label>Email</label><input id="e" type="email"><br><br><label>Password (min 8 chars)</label><input id="pw" type="password"><br><br><button class="btn" onclick="reg()">Create Account</button></div>`}
function reg(){const n=$("#n").value.trim(),e=$("#e").value.trim(),p=$("#pw").value;if(n.length<2||!/^\S+@\S+\.\S+$/.test(e)||p.length<8)return toast("Enter a valid name, email and 8+ char password");S.auth=true;S.name=n;S.email=e;toast("Welcome, "+n);go("profile")}
function logout(){S.auth=false;go("home")}
function demo(to="dash"){Object.assign(S,{auth:true,name:"Alex Sharma",email:"alex@example.com",degree:"B.Tech Information Technology",college:"Nirma University",cgpa:8.2,skills:{Python:2,C:2,HTML:2,CSS:2,JavaScript:2},soft:{Communication:2,Teamwork:2,"Problem Solving":2},projects:[{n:"Portfolio Site",t:"HTML, CSS, JS"},{n:"Student Marks Tracker",t:"Python"}],certs:[{n:"Python Programming — Coursera"},{n:"HTML & CSS — freeCodeCamp"},{n:"Intro to Git — Coursera"}],interns:[],noIntern:true,resume:true,github:true,linkedin:false,career:"Software Engineer",xp:1240,hist:[40,48,55,61]});analyze(true);toast("Demo student loaded");go(to)}
function analyze(q){const a=calc();if(!a)return;S.hist=S.hist.slice(-9);if(S.hist[S.hist.length-1]!==a.total)S.hist.push(a.total);genTasks();save()}
function compl(){const f=[["Name",S.name],["Degree",S.degree],["CGPA",S.cgpa],["Skills",Object.keys(S.skills).length],["a project",S.projects.length],["a certification",S.certs.length],["Internship details",S.interns.length||S.noIntern],["Resume",S.resume],["LinkedIn",S.linkedin],["GitHub",S.github]];return{p:Math.round(f.filter(x=>x[1]).length/f.length*100),miss:f.filter(x=>!x[1]).map(x=>x[0])}}
function dash(){const a=calc(),c=compl(),h=new Date().getHours(),g=h<12?"Morning":h<18?"Afternoon":"Evening";
if(!a)return`<h1>Good ${g}, ${S.name.split(" ")[0]} 👋</h1><div class="empty">You haven't chosen a destination yet. <button class="btn" onclick="go('career')">Choose Your Destination</button></div>`;
const nt=S.tasks.find(t=>!t.done),L=level(),pts=S.hist.length>1?S.hist:[a.total];
const spark=`<svg viewBox="0 0 200 60" style="width:100%;height:80px"><polyline fill="none" stroke="var(--p)" stroke-width="3" points="${pts.map((v,i)=>`${i*(190/Math.max(1,pts.length-1))+5},${55-v*.5}`).join(" ")}"/></svg>`;
return`<h1>Good ${g}, ${S.name.split(" ")[0]} 👋</h1><div class="grid"><div class="card"><div class="mut">Your Destination</div><div class="big">${S.career}</div><a class="mut" style="cursor:pointer;color:var(--p)" onclick="go('career')">Change</a></div><div class="card"><div class="mut">Career Readiness</div><div class="big">${a.total}%</div><div class="bar"><div style="width:${a.total}%"></div></div></div><div class="card"><div class="mut">Your Biggest Gap</div><div class="big">${a.gaps[0]?a.gaps[0].k:"None 🎉"}</div></div><div class="card"><div class="mut">Today's Priority</div><b>${nt?nt.t:"All done!"}</b><br><br><button class="btn" onclick="go('tasks')">Start Today's Task</button></div></div>
<div class="grid" style="margin-top:14px"><div class="card"><div class="mut">CareerXP · ${L[1]}</div><div class="big">${S.xp.toLocaleString()} XP</div><p>Tasks ${done()}/${S.tasks.length} · Projects ${S.projects.length} · Certs ${S.certs.length}</p></div><div class="card"><div class="mut">Next Milestone</div><b>Complete ${roadmap()[0]?roadmap()[0][0]:"your roadmap"}</b><p>Weekly progress: ${S.tasks.length?pct(done()/S.tasks.length):0}%</p></div><div class="card"><div class="mut">Readiness over time</div>${spark}<span class="mut">${pts.join("% → ")}%</span></div><div class="card"><div class="mut">Profile completion: ${c.p}%</div><div class="bar"><div style="width:${c.p}%"></div></div><p class="mut">${c.miss.length?"Missing: "+c.miss.join(", "):"Complete!"}</p><button class="btn s" onclick="go('profile')">Complete My Profile</button></div></div>
<div class="card" style="margin-top:14px"><b>🏅 Badges</b><p>${[["🏆 First Project",S.projects.length>0],["🎓 First Certification",S.certs.length>0],["📄 Resume Ready",S.resume],["🚀 First Internship",S.interns.length>0],["🎯 80% Readiness",a.total>=80]].map(b=>`<span class="chip ${b[1]?"l3":""}">${b[0]}</span>`).join("")}</p></div>
<div class="card row" style="margin-top:14px"><span>💬 Your CareerTwin has a suggestion for you.</span><button class="btn s" onclick="tw('What should I learn today?')">View</button></div>`}
function profile(){const c=compl(),chips=(L,k)=>L.map(s=>`<span class="chip ${S[k][s]?"l"+S[k][s]:""}" onclick="cyc('${k}','${s}')">${s}${S[k][s]?" · "+LV[S[k][s]]:""}</span>`).join("");
return`<h1>Student Profile</h1><div class="card"><div class="row" style="justify-content:space-between"><b>Profile completion ${c.p}%</b><span class="mut">${["Personal","Education","Skills","Projects","Certifications","Internships","Achievements","Preferences"].join(" → ")}</span></div><div class="bar"><div style="width:${c.p}%"></div></div></div><br>
<div class="card"><h3>Personal & Education</h3><div class="grid"><div><label>Full name</label><input value="${S.name}" onchange="S.name=this.value;save()"></div><div><label>Degree / Branch</label><input value="${S.degree}" placeholder="B.Tech – Information Technology" onchange="S.degree=this.value;save()"></div><div><label>College</label><input value="${S.college}" onchange="S.college=this.value;save()"></div><div><label>CGPA (0–10)</label><input type="number" min="0" max="10" step=".1" value="${S.cgpa||""}" onchange="S.cgpa=Math.min(10,Math.max(0,+this.value));save()"></div></div><p style="margin-top:10px"><label><input type="checkbox" style="width:auto" ${S.resume?"checked":""} onchange="S.resume=this.checked;save()"> Resume uploaded</label> &nbsp; <label><input type="checkbox" style="width:auto" ${S.github?"checked":""} onchange="S.github=this.checked;save()"> GitHub added</label> &nbsp; <label><input type="checkbox" style="width:auto" ${S.linkedin?"checked":""} onchange="S.linkedin=this.checked;save()"> LinkedIn added</label></p></div><br>
<div class="card"><h3>Technical Skills</h3><p>Tap to cycle Beginner → Intermediate → Advanced → remove.</p>${chips(SK,"skills")}<h3 style="margin-top:14px">Soft Skills</h3>${chips(SOFT,"soft")}</div><br>
<div class="grid"><div class="card"><h3>Projects (${S.projects.length})</h3>${S.projects.map(p=>`<div class="chip l2">${p.n} <small>${p.t||""}</small></div>`).join("")||'<div class="empty">No projects yet — we will add one to your roadmap.</div>'}<br><button class="btn s" onclick="add('projects','Project name','Technologies used')">+ Add Project</button></div>
<div class="card"><h3>Certifications (${S.certs.length})</h3>${S.certs.map(p=>`<div class="chip l2">${p.n}</div>`).join("")||'<div class="empty">No certifications yet. That\'s fine — we\'ll suggest some.</div>'}<br><button class="btn s" onclick="add('certs','Certification — Organization')">+ Add Certification</button></div>
<div class="card"><h3>Internships (${S.interns.length})</h3>${S.interns.map(p=>`<div class="chip l2">${p.n}</div>`).join("")||'<div class="empty">No internship yet? That\'s okay. CareerGPS will add internship preparation to your roadmap.</div>'}<br><button class="btn s" onclick="add('interns','Company — Role')">+ Add Internship</button> <label><input type="checkbox" style="width:auto" ${S.noIntern?"checked":""} onchange="S.noIntern=this.checked;save()"> I don't have internship experience yet</label></div></div><br><button class="btn" onclick="go('career')">Choose Your Destination →</button>`}
function cyc(k,s){const v=((S[k][s]||0)+1)%4;v?S[k][s]=v:delete S[k][s];if(S.career)analyze();save();render()}
function add(k,a,b){const n=prompt(a);if(!n||!n.trim())return;const t=b?prompt(b)||"":"";S[k].push({n:n.trim().slice(0,80),t:t.slice(0,80)});if(k==="interns")S.noIntern=false;if(S.career)analyze();save();render();toast("Added — score updated")}
function career(){const q=window._q||"";const list=Object.keys(CAR).filter(c=>c.toLowerCase().includes(q.toLowerCase()));
return`<h1>Where Do You Want To Go?</h1><p>What is your dream job or career?</p><input placeholder="Search careers…" value="${q}" oninput="window._q=this.value;render();$('#v input').focus();$('#v input').setSelectionRange(99,99)" style="max-width:420px"><br><br><div class="grid">${list.map(c=>{const a=calc(c);return`<div class="card"><h3>${c}</h3><p>Difficulty: ${CAR[c].d} · ~${CAR[c].wk} weeks prep</p><p>Your readiness: <b>${a.total}%</b></p><button class="btn ${S.career===c?"s":""}" onclick="pick('${c}')">${S.career===c?"✓ Selected":"Analyze My Gap"}</button></div>`}).join("")||'<div class="empty">No match. Try another search.</div>'}</div><br><div class="card"><h3>I can't decide yet</h3><p>We'll rank careers by how well they match your profile.</p><button class="btn s" onclick="rec()">Find My Career</button><div id="rec"></div></div>`}
function rec(){const r=Object.keys(CAR).map(c=>[c,calc(c).total]).sort((a,b)=>b[1]-a[1]);$("#rec").innerHTML="<h3 style='margin-top:12px'>Top Career Matches</h3>"+r.map((x,i)=>pb(x[1],`${i+1}. ${x[0]}`)+`<button class="btn s" onclick="pick('${x[0]}')">Choose ${x[0]}</button>`).join("<br>")}
function pick(c){S.career=c;window._q="";save();$("#v").innerHTML=`<div class="card" style="text-align:center;padding:60px 20px"><div class="big">🧭</div><h2>Analyzing your profile against ${c}…</h2><div class="bar" style="max-width:300px;margin:16px auto"><div id="ld" style="width:5%"></div></div></div>`;setTimeout(()=>$("#ld").style.width="95%",50);setTimeout(()=>{analyze();go("gap")},1600)}
function gap(){const a=calc();if(!a)return`<div class="empty">Select a dream career first. <button class="btn" onclick="go('career')">Choose Your Destination</button></div>`;const C=CAR[S.career],N=Object.keys(a.cat),M=a.gaps.filter(g=>g.pri==="M").length;
return`<h1>Career Gap Analysis · ${S.career}</h1><div class="grid"><div class="card" style="text-align:center"><h3>Career Readiness Score</h3>${ring(a.total)}<p><b>You are ${a.total}% ready for your target career.</b></p></div><div class="card"><h3>Strong Areas</h3>${[...a.strong.map(k=>k),...(S.cgpa>=8?["Academic Qualification"]:[]),...(S.projects.length?[S.projects.length+" Projects"]:[])].map(x=>`<div>✓ ${x}</div>`).join("")||"<p>Keep building — strengths will appear here.</p>"}<h3 style="margin-top:14px">Areas To Improve</h3>${a.gaps.map(g=>`<div>⚠ ${g.k}</div>`).join("")}${!S.interns.length?"<div>⚠ Internship Experience</div>":""}</div></div><br>
<div class="card"><h3>Breakdown & Transparent Weights</h3>${N.map((k,i)=>pb(pct(a.cat[k]),`${k} <span class="mut">(weight ${a.w[i]}%)</span>`)).join("")}<p class="mut">Score = Σ (category match × career weight). Weights are configurable per career in the CAR config.</p></div><br>
<h2>What Am I Missing?</h2><p>🔴 ${a.gaps.filter(g=>g.pri==="H").length} high · 🟠 ${M} medium · 🟢 ${a.gaps.filter(g=>g.pri==="L").length} low priority</p>${a.gaps.length?"":'<div class="empty">No skill gaps — focus on projects and interviews!</div>'}<div class="grid">${a.gaps.map(g=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${g.k}</h3><span class="tag ${g.pri}">${{H:"High",M:"Medium",L:"Low"}[g.pri]}</span></div><p>Current: <b>${LV[g.cur]||"None"}</b> → Required: <b>${LV[g.req]}</b> · Gap: ${g.gap>1?"High":"Medium"}</p><p><b>Why you need it:</b> ${WHY[g.k]||""}</p><p class="mut">📚 ${RES[g.k]||"Official docs + hands-on practice"} · ⏱ ~${g.gap*3} weeks</p><button class="btn s" onclick="learn('${g.k}')">Start Learning</button></div>`).join("")}</div><br><button class="btn" onclick="go('roadmap')">Build My Roadmap →</button>`}
function learn(k){S.skills[k]=Math.min(3,(S.skills[k]||0)+1);analyze();render();toast(k+" level up! Score recalculated")}
function rm(){const a=calc();if(!a)return`<div class="empty">Pick a career to generate your roadmap. <button class="btn" onclick="go('career')">Choose Your Destination</button></div>`;return`<h1>Your Roadmap to ${S.career}</h1><div class="tl">${roadmap().map((m,i)=>`<div class="card"><span class="mut">Month ${i+1}</span><h3>${m[0]}</h3><p>${m[1]}</p></div>`).join("")}</div><button class="btn" onclick="go('tasks')">Start Today's Task →</button>`}
function tasks(){if(!S.career)return`<div class="empty">No tasks yet — choose a career first. <button class="btn" onclick="go('career')">Choose Your Destination</button></div>`;return`<h1>Tasks</h1><div class="card row" style="justify-content:space-between"><b>${S.xp.toLocaleString()} XP · ${level()[1]}</b><span>${done()}/${S.tasks.length} completed</span></div><br><div class="card">${S.tasks.map((t,i)=>`<div class="task"><input type="checkbox" ${t.done?"checked":""} onchange="tick(${i})"><div class="${t.done?"done":""}" style="flex:1"><b>${t.t}</b><div class="mut">${t.sk} · ${t.df} · ${t.min} min · Due: ${t.due}</div></div><span class="tag L">+10</span></div>`).join("")}</div><br><button class="btn" onclick="go('dash')">Continue My Journey →</button>`}
function tick(i){const t=S.tasks[i];t.done=!t.done;S.xp+=t.done?10:-10;save();render();if(t.done)toast("+10 Career Points!")}
function compare(){const ks=Object.keys(CAR),A=window._a||ks[0],B=window._b||ks[1],sel=(v,k)=>`<select onchange="window._${k}=this.value;render()">${ks.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("")}</select>`,ca=CAR[A],cb=CAR[B],ra=calc(A).total,rb=calc(B).total;
const col=(c,n,r)=>`<div class="card"><h3>${n}</h3><p><b>Skills:</b> ${Object.keys(c.s).join(", ")}</p><p><b>Projects:</b> ${c.p} · <b>Certs:</b> ${c.c} · <b>Internship:</b> ${c.e}</p><p><b>Prep time:</b> ~${c.wk} weeks · <b>Difficulty:</b> ${c.d}</p>${pb(r,"Your readiness")}</div>`;
return`<h1>Compare Careers</h1><div class="grid">${sel(A,"a")}${sel(B,"b")}</div><br><div class="grid">${col(ca,A,ra)}${col(cb,B,rb)}</div><br><div class="empty"><b>Based on your profile, ${ra>=rb?A:B} currently matches you better.</b></div>`}
// CareerTwin (mock AI using the student's real data)
function tw(q){const c=$("#chat");c.classList.add("open");if(!chat.length){bot(S.auth?"Hey! I'm your CareerTwin. I know your career goal and roadmap. What would you like help with today?":"Hey! I'm your CareerTwin. Create an account or load the Demo Student and I can personalize my advice.");}
$("#qa").innerHTML=["Explain My Score","What Should I Learn Today?","Help Me With My Tasks","Prepare Me For Interview","Improve My Resume","Change My Career Goal"].map(x=>`<span class="chip" onclick="tw('${x}')" style="font-size:12px">${x}</span>`).join("");if(q){chat.push(["u",q]);bot(reply(q))}else draw()}
function bot(t){chat.push(["b",t]);draw()}function draw(){$("#msgs").innerHTML=chat.map(m=>`<div class="m ${m[0]}">${m[1].replace(/</g,"&lt;")}</div>`).join("");$("#msgs").scrollTop=1e9}
function send(){const v=$("#ci").value.trim();if(!v)return;$("#ci").value="";tw(v)}
function reply(q){q=q.toLowerCase();const a=calc();if(!a)return"Choose your destination first (Dream Career page), then I can analyze your gaps.";const g=a.gaps,top=g[0]?g[0].k:"projects",nt=S.tasks.find(t=>!t.done);
if(/score|gap|why|analy/.test(q))return`Your ${S.career} readiness is ${a.total}/100. Weakest areas: ${Object.entries(a.cat).sort((x,y)=>x[1]-y[1]).slice(0,3).map(x=>x[0]+" ("+pct(x[1])+"%)").join(", ")}. Biggest skill gap: ${top}.`;
if(/learn|first|today/.test(q))return`Based on your target role, ${top} is your highest-priority skill. ${WHY[top]||""} Suggested resource: ${RES[top]||"official docs"}.`;
if(/task/.test(q))return nt?`Today's task: "${nt.t}" (${nt.min} min, ${nt.df}). It builds ${nt.sk}. Start small: set a timer, do one example, then tick it off for +10 XP.`:"You've finished all tasks! Check your Roadmap for the next milestone.";
if(/interview/.test(q))return`Sample ${S.career} questions:\n1. Tell me about a project you built and your role.\n2. Explain ${top} in simple terms.\n3. How do you debug a problem you've never seen?\n4. Why ${S.career}?`;
if(/resume/.test(q))return S.resume?"Resume tip: lead with projects, quantify results, and add "+(S.linkedin?"":"your LinkedIn link, plus ")+"links to GitHub.":"Upload a resume in Profile — it's worth 1/3 of your Resume & Portfolio score.";
if(/motiv|tired|lose|losing/.test(q))return"Progress beats perfection. Do just one 20-minute task today — you're already "+a.total+"% of the way to "+S.career+".";
if(/java|python/.test(q))return`For ${S.career}, ${CAR[S.career].s.Java&&!CAR[S.career].s.Python?"Java":"Python"} is the stronger pick right now. Master one deeply before adding the other.`;
if(/certificate|add/.test(q))return"Go to Profile → Certifications → + Add Certification.";
if(/career|change|goal/.test(q))return"Go to Dream Career and pick a new destination — your gap, roadmap and tasks update automatically.";
return"I can explain your score, suggest what to learn, help with tasks, or prep you for interviews. Try a quick action below!"}
render();
</script></body></html>
